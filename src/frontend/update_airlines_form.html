<html>
<title>
    Airline Record Management System
</title>

<head>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="update_airlines_form" type="submit">
        <h1>Update Airline</h1>
        <label for="company_name"> Company Name </label><br>
        <input type="text" name="company_name" /><br>
        <label for="Type"> Type </label><br>
        <input type="text" name="type" /><br>

        <input type="submit">
    </form>
    <!-- Load JavaScript file -->
    <script type="module">
        import { getAirlineData, formUpdateAirlinesSubmit } from "./js/update_airlines_form.js";
        document.addEventListener("DOMContentLoaded", () => {

            //get form from the page
            const form = document.getElementById("update_airlines_form")

            // get record params from the url
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            getAirlineData(id, form);
            form.addEventListener("submit", async (event) => {
                await formUpdateAirlinesSubmit(event);
                window.location.href = "dashboard.html?tab=airlines";
                alert("Submitted");
            });
        });
    </script>

</body>

</html>
