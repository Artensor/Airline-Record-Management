<html>
<title>
    Airline Record Management System
</title>

<head>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <form id="update_flights_form" type="submit">
        <label for="date"> Date </label><br>
        <input type="datetime" name="date" /><br>
        <label for="start_city"> Start City </label><br>
        <input type="text" name="start_city" /><br>
        <label for="end_city"> End City </label><br>
        <input type="text" name="end_city" /><br>

        <input type="submit">
    </form>
    <!-- Load JavaScript file -->
    <script type="module">
        import { getFlightData, formUpdateFlightsSubmit } from "./js/update_flights_form.js";
        document.addEventListener("DOMContentLoaded", () => {

            //get form from the page
            const form = document.getElementById("update_flights_form")

            // get record params from the url
            const params = new URLSearchParams(window.location.search);
            const client_id = params.get("client_id");
            const airline_id = params.get("airline_id");
            const date = params.get("date");
            console.log(date);

            getFlightData(client_id, airline_id, date, form);
            form.addEventListener("submit", formUpdateFlightsSubmit(client_id, airline_id, date));
        });
    </script>

</body>

</html>
