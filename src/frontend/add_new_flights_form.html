<html>
<title>
    Airline Record Management System
</title>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="add_new_flights_form">
        <h1>Add New Flight</h1>
        <label for="client_id"> Client ID </label><br>
        <input type="number" name="client_id" min="0" /><br>
        <label for="airline_id"> Airline ID </label><br>
        <input type="number" name="airline_id" min="0" /><br>
        <label for="date"> Date </label><br>
        <input type="date" name="date" /><br>
        <label for="start_city"> Start City </label><br>
        <input type="text" name="start_city" /><br>
        <label for="end_city"> End City </label><br>
        <input type="text" name="end_city" /><br>

        <input type="submit">
    </form>

    <!-- Load JavaScript file -->
    <script type="module">
    import { formFlightsSubmit } from "./js/add_new_flights_form.js";
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("add_new_flights_form");
        form.addEventListener("submit", async (event) => {
        const result = await formFlightsSubmit(event);

        // Only navigate/alert on true success (and not in test runs)
        if (result?.ok && !window.IS_TEST_ENV) {
            alert("Submitted");
            window.location.href = "/?tab=flights";
        }
        });
    });
    </script>   
</body>
</html>
