<html>
<title>
    Airline Record Management System
</title>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="add_new_airlines_form" type="submit">
        <label for="id">ID</label><br>
        <input type="number" name="id" id="id" min="0"><br>
        <label for="company_name"> Company Name </label><br>
        <input type="text" name="company_name" /><br>
        <label for="Type"> Type </label><br>
        <input type="text" name="type" /><br>

        <input type="submit">
    </form>
    <!-- Load JavaScript file -->
    <script type="module">
        import { formAirlinesSubmit } from "./js/add_new_airlines_form.js";
        const form = document.getElementById("add_new_airlines_form");
        form.addEventListener("submit", async (event) => {
            await formAirlinesSubmit(event);
            window.location.href = "dashboard.html?tab=airlines";
            alert("Submitted");
        }); 
    </script>

</body>

</html>
